[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrf"
version = "0.1.0"
description = "Contract clause risk flagging — Vertex AI Gemini pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pypdf>=4.3.1",
  "google-genai>=1.20.0",
  "google-cloud-aiplatform>=1.70.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ccrf = "ccrf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
